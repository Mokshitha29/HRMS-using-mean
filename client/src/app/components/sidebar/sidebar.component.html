<div class="sidebar-wrapper d-flex flex-column p-3 text-white bg-dark">
  <div class="sidebar-header pb-3 mb-3 border-bottom border-secondary">
    <span class="fs-6 fw-bold tracking-wide text-uppercase text-light text-opacity-75">Navigation</span>
  </div>

  <ul class="nav nav-pills flex-column mb-auto gap-1">
    <!-- Dashboard -->
    <li class="nav-item">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link text-white d-flex align-items-center gap-2">
        <i class="bi bi-speedometer2 fs-5"></i>
        <span>Dashboard</span>
      </a>
    </li>

    <!-- Employees (Admin/HR full access, Employee read-only/directory) -->
    <li class="nav-item">
      <a routerLink="/employees" routerLinkActive="active" class="nav-link text-white d-flex align-items-center gap-2">
        <i class="bi bi-people fs-5"></i>
        <span>Employees</span>
      </a>
    </li>

    <!-- Attendance -->
    <li class="nav-item">
      <a routerLink="/attendance" routerLinkActive="active" class="nav-link text-white d-flex align-items-center gap-2">
        <i class="bi bi-calendar-check fs-5"></i>
        <span>Attendance</span>
      </a>
    </li>

    <!-- Leaves -->
    <li class="nav-item">
      <a routerLink="/leaves" routerLinkActive="active" class="nav-link text-white d-flex align-items-center gap-2">
        <i class="bi bi-envelope-paper fs-5"></i>
        <span>Leaves</span>
      </a>
    </li>

    <!-- Payroll -->
    <li class="nav-item">
      <a routerLink="/payroll" routerLinkActive="active" class="nav-link text-white d-flex align-items-center gap-2">
        <i class="bi bi-cash-stack fs-5"></i>
        <span>Payroll</span>
      </a>
    </li>
  </ul>

  <hr class="border-secondary">

  <!-- Logout in sidebar -->
  <div class="dropdown">
    <button (click)="logout()" class="btn btn-outline-light w-100 d-flex align-items-center justify-content-center gap-2">
      <i class="bi bi-box-arrow-left"></i>
      <span>Sign Out</span>
    </button>
  </div>
</div>
