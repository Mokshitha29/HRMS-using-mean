<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
      <div class="card shadow border-0 rounded-4 overflow-hidden">
        <div class="card-header bg-primary text-white text-center py-4">
          <div class="d-flex justify-content-center mb-2">
            <i class="bi bi-person-badge-fill display-5"></i>
          </div>
          <h3 class="fw-bold mb-1">HRMS Portal</h3>
          <p class="small text-white-50 mb-0">Human Resource Management System</p>
        </div>

        <div class="card-body p-4 p-md-5 bg-white">
          <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <div>{{ errorMessage }}</div>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input
                  type="email"
                  id="email"
                  class="form-control"
                  placeholder="name@company.com"
                  formControlName="email"
                  [ngClass]="{ 'is-invalid': f['email'].touched && f['email'].errors }"
                />
              </div>
              <div *ngIf="f['email'].touched && f['email'].errors" class="text-danger small mt-1">
                <span *ngIf="f['email'].errors['required']">Email is required.</span>
                <span *ngIf="f['email'].errors['email']">Please enter a valid email address.</span>
              </div>
            </div>

            <!-- Password -->
            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  placeholder="Enter your password"
                  formControlName="password"
                  [ngClass]="{ 'is-invalid': f['password'].touched && f['password'].errors }"
                />
              </div>
              <div *ngIf="f['password'].touched && f['password'].errors" class="text-danger small mt-1">
                <span *ngIf="f['password'].errors['required']">Password is required.</span>
                <span *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters.</span>
              </div>
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              class="btn btn-primary w-100 py-2 fw-semibold mb-3"
              [disabled]="loginForm.invalid || loading"
            >
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
              {{ loading ? 'Signing in...' : 'Sign In' }}
            </button>
          </form>

          <!-- Quick Fill Demo Accounts -->
          <div class="border-top pt-3 mt-4 text-center">
            <div class="small text-muted mb-2 fw-semibold">Quick Demo Login:</div>
            <div class="btn-group btn-group-sm w-100">
              <button (click)="quickFill('ADMIN')" class="btn btn-outline-danger">Admin</button>
              <button (click)="quickFill('HR')" class="btn btn-outline-primary">HR</button>
              <button (click)="quickFill('EMPLOYEE')" class="btn btn-outline-info">Employee</button>
            </div>
          </div>

          <!-- Register Link -->
          <div class="text-center mt-4">
            <span class="text-muted small">Don't have an account? </span>
            <a routerLink="/register" class="text-primary text-decoration-none small fw-semibold">Register here</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
